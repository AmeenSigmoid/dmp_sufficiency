<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMP Guide — Data Product Marketplace</title>
<style>
:root{
  --accent:#001DCA; --accent-deep:#00337B; --wash:#EAF0FE; --wash-line:#C7D6FB;
  --ground:#EEF1F8; --card:#FFFFFF; --card-2:#F7F9FE; --sidebar:#0B1533;
  --ink:#101828; --muted:#475467; --faint:#667085; --line:#E4E7EC;
  --vg:#1C8A5B; --g:#54A97F; --a:#D69100; --r:#E06A34; --vr:#C0392B; --z:#AEB6C6;
  --vg-bg:#E4F3EC; --g-bg:#E9F5EF; --a-bg:#FBF0D6; --r-bg:#FBE7DA; --vr-bg:#FBE3E0; --z-bg:#EEF0F4;
  --shadow:0 22px 55px -30px rgba(16,26,64,.4);
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.tabnum{font-variant-numeric:tabular-nums}

/* ── app shell ── */
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
@media (max-width:880px){.shell{grid-template-columns:1fr}}

/* sidebar */
.side{background:var(--sidebar);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
@media (max-width:880px){.side{position:static;height:auto}}
.side-brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;padding:0 4px}
.side-mark{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--accent);display:grid;place-items:center;flex:none}
.side-mark svg{width:20px;height:20px}
.side-brand b{font-size:15px;font-weight:800;letter-spacing:-.01em;display:block;color:#fff}
.side-brand span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#8FA0D8;font-weight:700}
.side-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6E7DB0;font-weight:800;margin:6px 8px 4px}
.navitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;color:#C7D0EC;padding:10px 11px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.14s}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem.on{background:var(--accent);color:#fff}
.navitem .n{flex:none;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:11.5px;font-weight:800;margin-top:1px}
.navitem.on .n{background:rgba(255,255,255,.22)}
.navitem .nt{min-width:0}
.navitem .nt b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.navitem .nt small{display:block;font-size:11px;color:inherit;opacity:.62;margin-top:1px;line-height:1.35}
.side-foot{margin-top:auto;padding-top:14px;font-size:10.5px;color:#6E7DB0;line-height:1.5;border-top:1px solid rgba(255,255,255,.08)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 30px;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@media (max-width:560px){.topbar{padding:12px 18px}}
.topbar .tb-crumb{font-size:12.5px;font-weight:700;color:var(--faint)}
.topbar .tb-crumb b{color:var(--ink)}
.theme-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s;flex:none}
.theme-btn:hover{color:var(--accent);border-color:var(--accent)}
.theme-btn svg{width:17px;height:17px}
.wrap{padding:34px 40px 80px;max-width:900px;width:100%;margin:0 auto}
@media (max-width:560px){.wrap{padding:26px 18px 60px}}
.sec{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* typography */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:9px}
.eyebrow .step-n{width:20px;height:20px;border-radius:6px;background:var(--wash);display:grid;place-items:center;color:var(--accent-deep)}
h1.title{font-size:32px;line-height:1.12;font-weight:800;letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
@media (max-width:560px){h1.title{font-size:25px}}
.lede{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 26px;max-width:64ch}
h2.h{font-size:15px;font-weight:800;letter-spacing:.02em;margin:30px 0 13px;display:flex;align-items:center;gap:10px}
h2.h::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
p{margin:0 0 13px;color:var(--ink)}
p.mut{color:var(--muted);font-size:14px}
a.link{color:var(--accent);font-weight:650;text-decoration:none} a.link:hover{text-decoration:underline}
b,strong{font-weight:700}
code{font-family:var(--mono);font-size:12.5px;background:var(--wash);color:var(--accent-deep);padding:1px 6px;border-radius:5px}

/* cards / grids */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 8px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card-2);padding:18px 19px}
.card h3{margin:0 0 6px;font-size:15.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.card .ic{width:30px;height:30px;border-radius:8px;background:var(--wash);color:var(--accent);display:grid;place-items:center;flex:none}
.card .ic svg{width:17px;height:17px}
.card .ic-motif{display:flex;align-items:center;height:46px;margin:0 0 12px}
.card .ic-motif svg{width:90px;height:44px}
.card p{font-size:13.5px;color:var(--muted);margin:0}
.flowcard{cursor:pointer;transition:.14s;text-align:left;display:flex;flex-direction:column;align-items:flex-start}
.flowcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 28px -18px color-mix(in srgb,var(--accent) 70%,transparent);background:var(--card)}
.flowcard .go{margin-top:auto;padding-top:14px;font-size:12.5px;font-weight:750;color:var(--accent);display:inline-flex;align-items:center;gap:5px}

.callout{display:flex;gap:12px;border:1px solid var(--wash-line);background:var(--wash);border-radius:12px;padding:14px 16px;margin:14px 0}
.callout .ic{flex:none;color:var(--accent);margin-top:1px}.callout .ic svg{width:18px;height:18px}
.callout p{margin:0;font-size:13.5px;color:var(--accent-deep)}
.callout.warn{border-color:color-mix(in srgb,var(--a) 40%,transparent);background:var(--a-bg)}
.callout.warn .ic{color:var(--a)} .callout.warn p{color:var(--ink)}

/* step rail */
.steprail{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.srail{flex:1;min-width:120px;border:1px solid var(--line);border-radius:11px;background:var(--card-2);padding:11px 13px;cursor:pointer;transition:.14s;text-align:left;font-family:inherit;color:inherit}
.srail:hover{border-color:var(--accent)}
.srail.on{border-color:var(--accent);background:var(--wash)}
.srail .sn{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.srail.on .sn{color:var(--accent)}
.srail b{display:block;font-size:13px;font-weight:750;margin-top:2px}

/* chips / picks */
.pick{margin:16px 0}
.pick-h{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ex-cta-row{display:flex;align-items:center;gap:14px;margin:16px 0 6px;flex-wrap:wrap}
.ex-cta{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:13px 24px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px -10px rgba(0,29,202,.65);transition:.14s}
.ex-cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
.ex-plus{font-size:19px;font-weight:800;line-height:1}
.ex-cta-note{font-size:12.5px;color:var(--faint);font-style:italic}
.kpi-dd{position:relative;max-width:560px}
.kpi-control{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi-control:hover{border-color:var(--accent)}
.kpi-caret{transition:.15s;color:var(--faint)} .kpi-caret.open{transform:rotate(180deg)}
.kpi-panel{position:absolute;z-index:20;left:0;right:0;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.kpi-searchwrap{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.kpi-si{color:var(--faint);font-size:13px}
.kpi-search{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink)}
.kpi-list{max-height:280px;overflow-y:auto}
.kpi-opt{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--card-2)}
.kpi-opt:hover{background:var(--card-2)}
.kpi-opt input{width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer}
.kpi-name{flex:1;font-size:13.5px;font-weight:600;color:var(--ink)}
.kpi-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;white-space:nowrap}
.kpi-empty{padding:16px;text-align:center;color:var(--faint);font-size:13px}
.kpi-foot{display:flex;justify-content:flex-end;padding:9px 12px;border-top:1px solid var(--line)}
.kpi-done{font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:7px 16px;cursor:pointer}
.kpi-pill .kpi-x{margin-left:6px;opacity:.75;font-weight:800}
.desc-ta{width:100%;max-width:560px;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:11px 13px;font-family:inherit;font-size:13.5px;color:var(--ink);outline:0;line-height:1.5}
.desc-ta:focus{border-color:var(--accent)}
.desc-ta::placeholder{color:var(--faint)}
.chip{font-size:13px;font-weight:650;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);color:var(--muted);cursor:pointer;transition:.12s;font-family:inherit}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,.navitem:focus-visible,.srail:focus-visible,.flowcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* uc list */
.uclist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:640px){.uclist{grid-template-columns:1fr}}
.uc{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:11px;background:var(--card-2);padding:12px 14px;cursor:pointer;transition:.12s;text-align:left;font-family:inherit;color:inherit}
.uc:hover{border-color:var(--accent);background:var(--card)}
.uc.on{border-color:var(--accent);background:var(--wash)}
.uc b{font-size:13.5px;font-weight:700}
.uc .mini{display:flex;gap:4px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%}
.dot.vg{background:var(--vg)}.dot.g{background:var(--g)}.dot.a{background:var(--a)}.dot.r{background:var(--r)}.dot.vr{background:var(--vr)}.dot.z{background:var(--z)}

/* coverage read */
.reads{display:flex;gap:14px;margin:16px 0}
@media (max-width:560px){.reads{flex-direction:column}}
.read{flex:1;border:1px solid var(--line);border-radius:13px;background:var(--card-2);padding:16px 18px}
.read .rl{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.read .rv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.read .rs{font-size:12.5px;color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bar-row{display:grid;grid-template-columns:180px 1fr 44px;gap:12px;align-items:center}
@media (max-width:560px){.bar-row{grid-template-columns:120px 1fr 40px}}
.bar-lbl{font-size:12.5px;font-weight:650}
.bar-track{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.1,1)}
.bar-val{font-size:12.5px;font-weight:800;text-align:right}
.f-vg{background:var(--vg)}.f-g{background:var(--g)}.f-a{background:var(--a)}.f-r{background:var(--r)}.f-vr{background:var(--vr)}.f-z{background:var(--z)}
.t-vg{color:var(--vg)}.t-g{color:var(--g)}.t-a{color:var(--a)}.t-r{color:var(--r)}.t-vr{color:var(--vr)}.t-z{color:var(--z)}

/* heatmap */
.hm-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;background:var(--card);color:var(--muted);border:0;cursor:pointer;border-left:1px solid var(--line);transition:.12s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;color:var(--faint);flex-wrap:wrap}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.hm-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.hm{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
table.hm th,table.hm td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.hm th:last-child,table.hm td:last-child{border-right:0}
table.hm thead th{background:var(--card-2);font-weight:800;color:var(--muted);font-size:11px;letter-spacing:.02em;position:sticky;top:0}
table.hm th.l,table.hm td.l{text-align:left;font-weight:700;color:var(--ink);white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
table.hm td.l.sub{font-weight:600;color:var(--muted);padding-left:22px;font-size:12px}
table.hm td.cell{font-weight:750;cursor:pointer;transition:filter .12s}
table.hm td.cell:hover{filter:brightness(.94)}
.c-vg{background:var(--vg-bg);color:var(--vg)}.c-g{background:var(--g-bg);color:var(--g)}.c-a{background:var(--a-bg);color:var(--a)}.c-r{background:var(--r-bg);color:var(--r)}.c-vr{background:var(--vr-bg);color:var(--vr)}.c-z{background:var(--z-bg);color:var(--z)}
.hfilters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hf-col{border:1px solid var(--line);border-radius:11px;background:var(--card-2);padding:11px 12px}
.hf-h{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.hf-list{display:flex;flex-wrap:wrap;gap:6px}
.hf-chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
table.hm td.oas-td{padding:5px 6px;vertical-align:middle}
table.hm td.oas-td.empty{color:var(--z);text-align:center;font-weight:700}
.oas{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11.5px;font-weight:750;border-radius:6px;padding:2px 7px;margin:2px 0;min-width:66px}
.oas i{font-style:normal;font-weight:800;opacity:.65;font-size:9.5px;width:9px;text-align:left}
@media (max-width:640px){.hfilters{grid-template-columns:1fr}}
.sd-tabs{display:inline-flex;gap:2px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.sd-tab{font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 16px;border-radius:9px}
.sd-tab.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(16,26,64,.12)}
table.hm.sd th.grp{background:var(--card-2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
table.hm.sd td.sdc{font-weight:750;text-align:center;padding:8px 10px;min-width:62px}
table.hm.sd tr.sd-exp td{background:#EEF1F6;color:var(--muted);font-weight:600}
table.hm.sd tr.sd-exp td.sdc{text-align:center}
table.hm.sd tr.sd-total td.l code{color:var(--ink);font-weight:800}
table.hm.sd td.l code{font-size:11px}
.cellnote{margin-top:12px;border:1px dashed var(--wash-line);border-radius:11px;background:var(--wash);padding:13px 15px;font-size:13px;color:var(--accent-deep);min-height:20px}
.cellnote code{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cellnote.empty{color:var(--faint);border-style:dashed;background:transparent;border-color:var(--line)}

/* tables (generic) */
.rtable{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.rtable th,.rtable td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800}
.rtable td b{font-weight:700}
.tier{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;background:var(--card-2);padding:14px 16px;margin-bottom:10px}
.tier .tn{flex:none;width:30px;height:30px;border-radius:8px;background:var(--wash);color:var(--accent-deep);display:grid;place-items:center;font-weight:800;font-size:13px}
.tier b{font-size:14px}.tier p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tier .contacts{margin-top:8px;line-height:1.95}
.app-ref{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.app-ref-lbl{font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--faint)}
.app-btn{display:inline-block;background:#2F6FE0;color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tier a,details.faq .fa a{color:var(--accent);text-decoration:none;font-weight:600}
.tier a:hover,details.faq .fa a:hover{text-decoration:underline}

/* faq */
details.faq{border:1px solid var(--line);border-radius:11px;background:var(--card-2);margin-bottom:9px;overflow:hidden}
details.faq summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);transition:.15s;flex:none}
details.faq[open] summary::before{transform:rotate(45deg)}
details.faq .fa{padding:0 16px 15px;font-size:13.5px;color:var(--muted);line-height:1.6}

/* footer nav */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:38px;padding-top:20px;border-top:1px solid var(--line)}
.pgbtn{font-family:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.14s;display:inline-flex;align-items:center;gap:8px;max-width:48%}
.pgbtn:hover{border-color:var(--accent);color:var(--accent)}
.pgbtn.next{background:var(--accent);color:#fff;border-color:var(--accent)}
.pgbtn.next:hover{filter:brightness(1.07);color:#fff}
.pgbtn small{display:block;font-size:10.5px;font-weight:700;opacity:.6;letter-spacing:.04em;text-transform:uppercase}
.pgbtn.hide{visibility:hidden}
/* calculating-coverage modal */
.gcalc-ov{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(6,11,28,.5);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.gcalc-ov.show{opacity:1}
.gcalc-card{width:min(444px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;transform:translateY(10px) scale(.98);transition:transform .3s}
.gcalc-ov.show .gcalc-card{transform:none}
.gcalc-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.gcalc-spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--wash);border-top-color:var(--accent);animation:gspin .8s linear infinite;flex:none}
@keyframes gspin{to{transform:rotate(360deg)}}
.gcalc-h{font-size:16px;font-weight:800;color:var(--ink)}
.gcalc-sub{font-size:12.5px;color:var(--faint);margin-top:2px;min-height:16px}
.gcalc-steps{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.gcalc-step{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--faint);transition:color .25s}
.gcalc-ic{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;box-sizing:border-box;position:relative;transition:.25s}
.gcalc-step.active{color:var(--ink)}
.gcalc-step.active .gcalc-ic{border-color:var(--wash-line);border-top-color:var(--accent);animation:gspin .8s linear infinite}
.gcalc-step.done{color:var(--vg)}
.gcalc-step.done .gcalc-ic{border-color:var(--vg);background:var(--vg);animation:none}
.gcalc-step.done .gcalc-ic::after{content:'';position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.gcalc-bar{height:7px;border-radius:20px;background:var(--line);overflow:hidden;margin-bottom:12px}
.gcalc-fill{height:100%;width:0;border-radius:20px;background:var(--accent)}
.gcalc-note{font-size:12px;color:var(--faint);line-height:1.5}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const GCALC_PHASES=["Checking tables","Checking dimensions","Checking KPIs","Assessing grain & freshness","Scoring availability & sufficiency","Calculating the heat map"];
const GCALC_DETAIL=["Connecting to the data lakehouse…","Locating candidate data products…","Validating join keys (customer & product)…","Mapping dimensions — Market · Banner · Brand…","Assessing grain — time / customer / product…","Scoring data availability…","Computing sufficiency across 172 markets…","Applying RAG thresholds…","Rendering the heat map…"];
let gcalcInt=null, gcalcEnd=null;
function newCalc(){
  const T=4200;
  const ov=document.createElement("div"); ov.className="gcalc-ov"; ov.id="gcalcOv";
  ov.innerHTML=`<div class="gcalc-card" role="dialog" aria-modal="true" aria-label="Calculating coverage">
    <div class="gcalc-top"><span class="gcalc-spin" aria-hidden="true"></span><div><div class="gcalc-h">Calculating coverage</div><div class="gcalc-sub" id="gcalcSub">${GCALC_DETAIL[0]}</div></div></div>
    <ul class="gcalc-steps" id="gcalcSteps">${GCALC_PHASES.map((p,i)=>`<li class="gcalc-step" data-i="${i}"><span class="gcalc-ic"></span>${p}</li>`).join("")}</ul>
    <div class="gcalc-bar"><div class="gcalc-fill" id="gcalcFill"></div></div>
    <div class="gcalc-note">In the app this is a <b>~30-minute</b> job — keep the window open and the heat map opens automatically. (Sped up here for the walkthrough.)</div>
  </div>`;
  document.body.appendChild(ov); setTimeout(()=>ov.classList.add("show"),20);
  const t0=Date.now();
  const tick=()=>{ const el=Date.now()-t0, prog=Math.min(1,el/T);
    const f=document.getElementById("gcalcFill"); if(f) f.style.width=(prog*100).toFixed(1)+"%";
    const sub=document.getElementById("gcalcSub"); if(sub&&prog<1) sub.textContent=GCALC_DETAIL[Math.floor(el/600)%GCALC_DETAIL.length];
    const cur=Math.min(GCALC_PHASES.length-1,Math.floor(prog*GCALC_PHASES.length));
    document.querySelectorAll("#gcalcSteps .gcalc-step").forEach(li=>{ const i=+li.dataset.i; li.classList.toggle("done",prog>=1||i<cur); li.classList.toggle("active",prog<1&&i===cur); });
  };
  tick(); gcalcInt=setInterval(tick,200); gcalcEnd=setTimeout(newCalcDone,T);
}
function newCalcDone(){
  if(gcalcInt){ clearInterval(gcalcInt); gcalcInt=null; } if(gcalcEnd){ clearTimeout(gcalcEnd); gcalcEnd=null; }
  const f=document.getElementById("gcalcFill"); if(f) f.style.width="100%";
  document.querySelectorAll("#gcalcSteps .gcalc-step").forEach(li=>{ li.classList.add("done"); li.classList.remove("active"); });
  const sub=document.getElementById("gcalcSub"); if(sub) sub.textContent="Done — opening your heat map…";
  const ov=document.getElementById("gcalcOv"); if(ov){ setTimeout(()=>{ ov.classList.remove("show"); setTimeout(()=>ov.remove(),300); },300); }
  setTimeout(()=>{ S.neu.step=2; render(); window.scrollTo({top:0,behavior:"smooth"}); },360);
}

  <div class="callout"><span class="ic">${IC.shield}</span><p>Because validation happens <b>at the source</b>, a sufficiency score is a governance statement, not a guess — it's safe to make build decisions from it.</p></div>`;
}

/* ── 6 · Getting help ── */
function secHelp(){
  const faqs=[
    ["Availability is high but sufficiency is low — why?","The data exists (available) but not at the granularity, freshness or with available history your use case specified (not sufficient). Open the ‘Solution Details’ view in the Heatmaps to see which specific sufficiency drivers are causing the gap."],
    ["Who specified the data to profile and sufficiency requirements for each solution?","Data product solution owners provided the data sources and sufficiency requirements. These are based on requirements provided by the business. As business needs change the sufficiency requirements can be updated to reflect evolving business needs."],
    ["How current are the scores?","The sufficiency scores for the governed use cases are updated weekly. Sufficiency scores for custom user created use cases are only updated as needed triggered by the user."],
    ["My data readiness score looks low because the solution is profiling fields (KDEs) in the source tables that are only meant to be for a specific region. Can the platform be updated to account for this?","Not right now. Use case scope (countries, customers, etc) and sufficiency requirements are defined at table level. If a use case contains global data tables but some columns in that table are specific to a region you will see those columns as green for countries in that region but red for all other countries. The low scores in this case are ‘expected’ but the scores will still impact the total aggregated sufficiency scores."],
    ["I know the data source contains data for all Kenvue products but I am seeing some brands readiness scores as ‘0’. What is causing this?","The data sufficiency solution maps all data sources against Kenvue enterprise dimensions (AG Country, GMC Brand, GCC Customer Banner). In some cases where the source data is pre-aggregated using different definitions of country, brand, customer the solution will either not include that dimension in the data sufficiency profile or it will only display the values from that dimension that match the enterprise dimension and the rest of the values will be scored under ‘all other’."]
  ];
  return `<p class="eyebrow"><span class="step-n">5</span> Getting help</p>
  <h1 class="title">Getting help</h1>
  <p class="lede">Start with this guide, then escalate through three tiers. Most questions are answered at Tier 1.</p>
  <h2 class="h">Support tiers</h2>
  <div class="tier"><span class="tn">1</span><div><b>Self-service</b><p>This reference along with in-app tool-tips such as ‘Data Readiness Score Calculation’. Best for “how do I read this?” questions.</p>
    <div class="app-ref"><span class="app-ref-lbl">In the app:</span><span class="app-btn">Data Readiness Score Calculation</span></div></div></div>
  <div class="tier"><span class="tn">2</span><div><b>Data Product champions</b><p>Please reach out to functional data product champions for questions about current use cases, adding new cases to platform, or to schedule a walkthrough of the solution:</p>
    <p class="mut contacts">Solution Business Owner: Steve Raser (<a href="mailto:sraser@kenvue.com">sraser@kenvue.com</a>)<br>
    Operations SME: Varun Jain (<a href="mailto:vjain06@kenvue.com">vjain06@kenvue.com</a>)<br>
    Commercial SME: Daniela Freitas (<a href="mailto:dfreita2@kenvue.com">dfreita2@kenvue.com</a>)</p></div></div>
  <div class="tier"><span class="tn">3</span><div><b>DMP platform team</b><p>For technical support or a suspected data issue please reach out to the DMP platform team at <a href="mailto:dl-dmp-datasufficiency@kenvue.com">dl-dmp-datasufficiency@kenvue.com</a>.</p></div></div>
  <h2 class="h">FAQ</h2>
  ${faqs.map(f=>`<details class="faq"><summary>${f[0]}</summary><div class="fa">${f[1]}</div></details>`).join("")}
  <div class="callout"><span class="ic">${IC.help}</span><p>Not sure which tier? Ask your domain champion first — they'll route anything they can't answer to the platform team.</p></div>`;
}

/* ═════════ render ═════════ */
const RENDER = {why:secWhy, old:secOld, new:secNew, heat:secHeat, help:secHelp};
function renderNav(){
  document.getElementById("nav").innerHTML = SECTIONS.map(s=>
    `<button class="navitem ${s.key===S.section?"on":""}" onclick="showSection('${s.key}')">
      <span class="n">${s.n}</span><span class="nt"><b>${s.nav}</b><small>${s.sub}</small></span></button>`).join("");
}
function render(){
  const sec=SECTIONS.find(s=>s.key===S.section);
  const el=document.getElementById("sec");
  el.style.animation="none"; void el.offsetWidth; el.style.animation="";
  el.innerHTML = (RENDER[S.section]||secWhy)() + pager();
  document.getElementById("tbTitle").textContent = "· "+sec.nav;
  renderNav();
}
function pager(){
  // sections with their own inline pagers (new flow) skip the global one
  if(S.section==="new") return "";
  const i=SIDX(S.section), prev=SECTIONS[i-1], next=SECTIONS[i+1];
  return `<div class="pager">
    ${prev?`<button class="pgbtn" onclick="showSection('${prev.key}')"><span><small>Previous</small>${prev.nav}</span></button>`:`<span class="pgbtn hide"></span>`}
    ${next?`<button class="pgbtn next" onclick="showSection('${next.key}')"><span><small>Next</small>${next.nav}</span> ${IC.chev}</button>`:`<span class="pgbtn hide"></span>`}
  </div>`;
}
function showSection(k){ S.section=k; render(); window.scrollTo({top:0,behavior:"smooth"}); }


render();
</script>

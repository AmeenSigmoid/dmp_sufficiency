<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Product Marketplace — Coverage</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: #F2F2F2;
  color: #1A1A1A;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; background: #fff; height: 56px;
  padding: 0 20px; border-bottom: 1px solid #E5E5E5; gap: 14px;
  flex-shrink: 0; z-index: 200;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #111; text-decoration: none; white-space: nowrap; }
.logo-box { width: 32px; height: 32px; background: #001DCA; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -1px; }
.header-search { flex: 1; max-width: 500px; margin: 0 auto; position: relative; }
.header-search input { width: 100%; padding: 8px 16px 8px 38px; border: 1px solid #E0E0E0; border-radius: 22px; font-size: 13px; background: #F8F8F8; color: #888; outline: none; transition: all 0.15s; }
.header-search input:focus { border-color: #555; background: #fff; color: #333; }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #AAA; pointer-events: none; }
.header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.help-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #DDD; background: none; cursor: pointer; color: #777; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s; }
.help-btn:hover { border-color: #999; color: #333; }
.user-chip { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background 0.15s; }
.user-chip:hover { background: #F5F5F5; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; }
.user-text .welcome { font-size: 10px; color: #AAA; line-height: 1.2; }
.user-text .name { font-size: 13px; font-weight: 600; color: #222; line-height: 1.2; }

/* ── App layout ── */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
.sidebar { width: 70px; background: #fff; border-right: 1px solid #E8E8E8; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 2px; flex-shrink: 0; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 6px; border-radius: 8px; cursor: pointer; width: 58px; color: #AAAAAA; transition: all 0.12s; text-align: center; }
.nav-item:hover { background: #F5F5F5; color: #555; }
.nav-item.active { background: #F0F0F0; color: #1A1A1A; }
.nav-icon { width: 22px; height: 22px; }
.nav-label { font-size: 10px; font-weight: 500; }

/* ── Main ── */
.main { flex: 1; overflow-y: auto; padding: 22px 24px; background: #F2F2F2; }

/* ── Breadcrumb ── */
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #AAA; margin-bottom: 6px; }
.breadcrumb a { color: #AAA; text-decoration: none; }
.breadcrumb a:hover { color: #555; }
.breadcrumb .sep { color: #DDD; }
.breadcrumb .current { color: #555; }

/* ── Page title ── */
.page-title { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 18px; }

/* ── Main tabs ── */
.main-tabs { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0 4px; border-bottom: 2px solid #E8E8E8; margin-bottom: 18px; }
.main-tab { display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; font-size: 13px; font-weight: 500; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; white-space: nowrap; line-height: 1.2; }
.main-tab:hover { color: #444; }
.main-tab.active { color: #001DCA; border-bottom-color: #001DCA; font-weight: 600; }

/* ── Content card ── */
.card { background: #fff; border-radius: 10px; border: 1px solid #E8E8E8; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }

/* ── View switcher + filters ── */
.sub-tabs { display: flex; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #EDEEF2; background: #FBFBFC; align-items: center; flex-wrap: wrap; }
.view-tabs { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #DADDE7; border-radius: 9px; background: #F2F4F8; box-shadow: inset 0 1px 2px rgba(16,24,40,0.04); flex-shrink: 0; }
.subtab-filters { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.subtab-filters .filter-drop { min-width: 94px; padding: 4px 24px 4px 9px; }
.subtab-filters .filter-name { font-size: 9.5px; }
.subtab-filters .filter-value { font-size: 11.5px; }
.apply-btn { background: #001DCA; color: #fff; border: none; border-radius: 7px; font-size: 11.5px; font-weight: 700; padding: 8px 15px; cursor: pointer; white-space: nowrap; transition: all .12s; align-self: center; }
.apply-btn:hover { background: #00337B; }
.apply-btn:active { transform: scale(.97); }
.apply-btn.applied { background: #1E7E34; }

/* Detail: expected-granularity reference row */
.detail-expected td { background: #EEF2FB; color: #33415C; font-weight: 600; font-size: 11px; border-bottom: 2px solid #D7E0F2; padding: 8px 12px; }
.detail-expected td:first-child { font-weight: 700; }
.sub-tab { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 0 14px; font-size: 12.5px; font-weight: 700; border-radius: 7px; cursor: pointer; border: 1px solid transparent; background: transparent; color: #697386; transition: color 0.14s, background 0.14s, box-shadow 0.14s, border-color 0.14s; white-space: nowrap; }
.sub-tab:hover { color: #1F2937; background: rgba(255,255,255,0.72); }
.sub-tab.active { background: #fff; color: #001DCA; border-color: #E3E6EF; box-shadow: 0 1px 3px rgba(16,24,40,0.12); }
.sub-tab.disabled { color: #A7ADBA; background: transparent; cursor: not-allowed; box-shadow: none; }
.sub-tab.disabled:hover { color: #A7ADBA; background: transparent; border-color: transparent; }
.sub-tab .lock { font-size: 10px; margin-right: 5px; opacity: 0.65; }
@media (max-width: 720px) {
  .view-tabs { width: 100%; flex-shrink: 1; }
  .view-tabs .sub-tab { flex: 1; min-width: 0; padding: 0 8px; font-size: 11.5px; }
  .subtab-filters { width: 100%; margin-left: 0; }
}
@keyframes nudge { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }
.sub-tab.nudge { animation: nudge 0.28s ease; }
.tab-hint { font-size: 11.5px; color: #9A9A9A; align-self: center; margin-left: 2px; transition: color 0.15s, opacity 0.15s; }
.tab-hint.flash { color: #C0392B; font-weight: 600; }

/* clickable use-case column header — styled as a button */
#pivot-table thead th.uc-link { cursor: pointer; padding: 8px 10px; }
.uc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 13px; border-radius: 20px; border: 1.5px solid #B9C4E6; background: #fff; color: #001DCA; font-size: 11.5px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 2px rgba(38,64,139,0.08); transition: all 0.14s ease; }
.uc-btn .uc-go { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #E7EBF7; color: #001DCA; transition: all 0.14s; }
#pivot-table thead th.uc-link:hover .uc-btn { background: #001DCA; color: #fff; border-color: #001DCA; box-shadow: 0 3px 10px rgba(38,64,139,0.30); transform: translateY(-1px); }
#pivot-table thead th.uc-link:hover .uc-go { background: rgba(255,255,255,0.25); color: #fff; transform: translateX(2px); }
#pivot-table thead th.uc-link:active .uc-btn { transform: translateY(0); box-shadow: 0 1px 2px rgba(38,64,139,0.2); }
.uc-sub { display: block; margin-top: 4px; font-size: 9px; letter-spacing: 0.5px; font-weight: 700; color: #97A3C6; text-transform: uppercase; }

/* drill-in instruction banner */
.drill-tip { display: flex; align-items: center; gap: 9px; margin: 0 18px 12px; padding: 9px 13px; background: #F0F3FB; border: 1px solid #DCE3F4; border-radius: 8px; font-size: 12px; color: #3C4A70; }
.drill-tip svg { flex-shrink: 0; color: #5B6FB0; }
.drill-tip b { color: #001DCA; }

/* detail context bar (drill-in breadcrumb) */
.detail-context { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #EAEAEA; background: #F7F8FB; }
.back-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: #fff; background: #001DCA; border: 1px solid #001DCA; border-radius: 7px; padding: 8px 15px; cursor: pointer; box-shadow: 0 1px 3px rgba(38,64,139,0.25); transition: all 0.13s; }
.back-btn:hover { background: #1B3170; border-color: #1B3170; transform: translateX(-2px); box-shadow: 0 2px 7px rgba(38,64,139,0.32); }
.back-btn svg { transition: transform 0.13s; }
.back-btn:hover svg { transform: translateX(-2px); }
.ctx-divider { width: 1px; height: 22px; background: #DADFEC; }
.ctx-label { font-size: 11px; color: #99A2BC; font-weight: 500; }
.ctx-uc { font-size: 13.5px; font-weight: 700; color: #1A2A55; display: inline-flex; align-items: center; gap: 6px; }
.ctx-uc::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #5B6FB0; }

/* ── Filters ── */
.filter-row { display: flex; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #F0F0F0; flex-wrap: wrap; align-items: center; }
.filter-wrap { position: relative; }
.filter-drop { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 5px 28px 5px 10px; border: 1px solid #E0E0E0; border-radius: 6px; background: #fff; cursor: pointer; min-width: 110px; transition: border-color 0.15s; user-select: none; }
.filter-drop:hover { border-color: #999; }
.filter-drop.open { border-color: #333; }
.filter-name { font-size: 10px; color: #AAA; line-height: 1.1; }
.filter-value { font-size: 12px; font-weight: 600; color: #222; line-height: 1.3; }
.filter-chevron { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #AAA; font-size: 9px; pointer-events: none; transition: transform 0.15s; }
.filter-drop.open .filter-chevron { transform: translateY(-50%) rotate(180deg); }
.dropdown-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 300; background: #fff; border: 1px solid #E0E0E0; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); min-width: 160px; overflow: hidden; }
.dropdown-menu.open { display: block; }
.dropdown-item { padding: 8px 14px; font-size: 12px; color: #333; cursor: pointer; transition: background 0.1s; }
.dropdown-item:hover { background: #F5F5F5; }
.dropdown-item.selected { background: #F0F0F0; font-weight: 600; }

/* ── Toolbar above table ── */
.tbl-toolbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px 0; flex-wrap: wrap; }
.toolbar-title { font-size: 13px; font-weight: 700; color: #111; margin-right: auto; }
.tool-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; color: #555; background: #F4F4F4; border: 1px solid #E5E5E5; border-radius: 6px; padding: 5px 11px; cursor: pointer; transition: all 0.12s; }
.tool-btn:hover { background: #ECECEC; color: #222; border-color: #D5D5D5; }

/* ── Legend ── */
.legend { display: flex; gap: 14px; align-items: center; padding: 10px 18px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }
.legend-sep { width: 1px; height: 14px; background: #E0E0E0; }
.legend-badge { display: inline-flex; align-items: center; }

/* ── Table base ── */
.table-wrap { overflow: auto; max-height: calc(100vh - 320px); position: relative; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
thead th { position: sticky; top: 0; background: #F4F4F4; z-index: 5; }

/* ── Pivot summary table ── */
#pivot-table thead th { padding: 0 12px; font-weight: 600; color: #555; border-bottom: 1px solid #E2E2E2; border-right: 1px solid #ECECEC; white-space: nowrap; text-align: center; }
/* stacked sticky header tiers — each row pins below the previous one */
#pivot-table thead th.tier-area  { background: #ECEFF7; color: #2C3E66; font-size: 11.5px; font-weight: 700; top: 0;    height: 30px; }
#pivot-table thead th.tier-group { background: #F1F3F9; color: #455784; font-size: 11px;   font-weight: 600; top: 29px; height: 28px; }
#pivot-table thead th.tier-uc    { background: #F7F8FB; color: #333;    font-size: 11.5px; font-weight: 600; top: 29px; height: 56px; }
#pivot-table { table-layout: fixed; }
#pivot-table .cg-label { width: 330px; }
#pivot-table .cg-grand { width: 132px; }
/* .cg-uc columns (OTIF / CTS) auto-split the remaining width — gives the heat map the space */
#pivot-table thead th.col-rowlabel { text-align: left; top: 0; left: 0; z-index: 7; background: #F4F4F4; min-width: 0; color: #444; font-weight: 700; vertical-align: bottom; padding: 9px 12px; }
.rl-eyebrow { font-size: 13px; font-weight: 800; color: #111; line-height: 1.2; }
.rl-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.rl-title { font-size: 10.5px; font-weight: 700; color: #9A9A9A; text-transform: uppercase; letter-spacing: .4px; }
.rl-toggle { white-space: nowrap; flex-shrink: 0; }
#pivot-table thead th.col-grand { background: #EDE9F6; color: #4527A0; font-weight: 700; top: 0; right: 0; z-index: 6; border-left: 2px solid #D9CEF0; line-height: 1.2; }

#pivot-table tbody td { padding: 0; border-bottom: 1px solid #F4F4F4; border-right: 1px solid #F4F4F4; }
#pivot-table tbody td.label-cell { position: sticky; left: 0; background: #fff; z-index: 3; border-right: 1px solid #ECECEC; }
#pivot-table tbody tr:hover td { background: #FAFAFC; }
#pivot-table tbody tr:hover td.label-cell { background: #F6F7FA; }
#pivot-table tbody td.grand-cell { position: sticky; right: 0; background: #FBFAFE; z-index: 2; border-left: 2px solid #ECE6F7; }

/* row level shading on label cell */
.lvl-1 .label-cell { background: #F4F5F8 !important; }
.lvl-2 .label-cell { background: #FAFBFD !important; }

/* label content */
.label-inner { display: flex; align-items: center; gap: 7px; padding: 8px 12px; min-height: 34px; }
.indent-guide { width: 1px; align-self: stretch; background: #EAEAEA; flex-shrink: 0; }
.chev { width: 15px; height: 15px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #999; transition: transform 0.15s, color 0.12s; }
.chev:hover { color: #333; }
.chev.open { transform: rotate(90deg); }
.chev.leaf { visibility: hidden; }
.label-text { font-size: 12px; }
.lvl-1 .label-text { font-weight: 700; color: #111; font-size: 12.5px; }
.lvl-2 .label-text { font-weight: 600; color: #2A2A2A; }
.lvl-3 .label-text { font-weight: 500; color: #444; }
.field-text { font-family: 'Menlo', ui-monospace, monospace; font-size: 11px; color: #777; }

/* Data Available / Data Sufficient badges */
.cat-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 20px; }
.cat-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.badge-avail { background: #E3F2FD; color: #1565C0; }
.badge-avail::before { background: #1E88E5; }
.badge-suff  { background: #E0F2F1; color: #00695C; }
.badge-suff::before { background: #00897B; }

/* ── value cell ── */
.val { position: relative; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 8px; }
.val-num { font-size: 12px; font-weight: 700; line-height: 1; }
.val-bar { width: 100%; max-width: 160px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.06); overflow: hidden; }
.val-bar > i { display: block; height: 100%; border-radius: 2px; }
td.grand-cell .val-num { font-weight: 800; }

/* RAG */
.rag-vg { background: #C8E6C9; }   /* ≥75 */
.rag-g  { background: #DCEDC8; }   /* 60–74 */
.rag-a  { background: #FFE9B3; }   /* 40–59 */
.rag-r  { background: #FFD2D2; }   /* 20–39 */
.rag-vr { background: #F4B6B6; }   /* <20 */
.rag-0  { background: #EF5350; }   /* 0 */
.num-vg { color: #1B5E20; } .num-g { color: #33691E; } .num-a { color: #8a5a00; }
.num-r  { color: #B71C1C; } .num-vr { color: #7F0000; } .num-0 { color: #fff; }
.bar-vg { background: #66BB6A; } .bar-g { background: #9CCC65; } .bar-a { background: #FFB300; }
.bar-r  { background: #EF5350; } .bar-vr { background: #C62828; } .bar-0 { background: #fff; }

/* grand total row */
.grand-total-row td { border-top: 2px solid #CFCFCF; }
.grand-total-row .label-cell { background: #EEE !important; }
.grand-total-row .label-text { font-weight: 800; color: #111; }
.grand-total-row .val-num { font-weight: 800; }

/* ── Detail view table (granularity) ── */
.section-title { font-size: 13px; font-weight: 700; color: #111; padding: 12px 18px 8px; }
#detail-table, #f5-detail-table, #f6-detail-table { font-size: 12px; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
#detail-table thead th, #f5-detail-table thead th, #f6-detail-table thead th { padding: 0 10px; height: 34px; border-right: 1px solid #E5E8EF; border-bottom: 1px solid #E5E8EF; vertical-align: middle; }
.col-group th { text-align: center; font-size: 11px; font-weight: 700; padding: 0 10px; height: 42px; border-bottom: 1px solid #E5E8EF; }
#detail-table thead th[rowspan], #f5-detail-table thead th[rowspan], #f6-detail-table thead th[rowspan] { border-bottom: 2px solid #D4DAE6; }
#detail-table thead tr:nth-child(2) th, #f5-detail-table thead tr:nth-child(2) th, #f6-detail-table thead tr:nth-child(2) th { border-bottom: 2px solid #D4DAE6; }
#detail-table thead tr:first-child th, #f5-detail-table thead tr:first-child th, #f6-detail-table thead tr:first-child th { top: 0; z-index: 8; }
#detail-table thead tr:nth-child(2) th, #f5-detail-table thead tr:nth-child(2) th, #f6-detail-table thead tr:nth-child(2) th { top: 34px; z-index: 8; }
#detail-table thead th[rowspan], #f5-detail-table thead th[rowspan], #f6-detail-table thead th[rowspan] { top: 0; height: 68px; z-index: 9; }
.col-avail { background: #E8F5E9; color: #2E7D32 !important; }
.col-suff  { background: #FFF3E0; color: #E65100 !important; }
.col-total { background: #EDE7F6; color: #4527A0 !important; }
.sub-col { font-weight: 500 !important; color: #666 !important; font-size: 10.5px !important; }
#detail-table tbody td, #f5-detail-table tbody td, #f6-detail-table tbody td { padding: 8px 12px; border-right: 1px solid #EEF0F3; border-bottom: 1px solid #EEF0F3; }
#detail-table tbody td.dv, #f5-detail-table tbody td.dv, #f6-detail-table tbody td.dv { padding: 0; }
#detail-table tbody td.dv .val, #f5-detail-table tbody td.dv .val, #f6-detail-table tbody td.dv .val { height: 36px; }
#detail-table .detail-expected td, #f5-detail-table .detail-expected td, #f6-detail-table .detail-expected td { border-right: 1px solid #D7E0F2; border-bottom: 2px solid #D7E0F2; }
#detail-table tbody tr:hover, #f5-detail-table tbody tr:hover, #f6-detail-table tbody tr:hover { background: #FAFAFA; }
.row-l1 td:first-child { font-weight: 700; color: #111; font-size: 12.5px; }
.row-l2 td:first-child { font-weight: 600; color: #333; }
.row-l3 td:first-child { font-weight: 500; color: #555; font-style: italic; }
.row-l4 td:first-child { font-weight: 400; color: #777; font-family: 'Menlo', monospace; font-size: 11px; }
.row-l5 td:first-child { font-weight: 400; color: #999; font-family: 'Menlo', monospace; font-size: 11px; }
.row-l1 { background: #F5F5F5; } .row-l2 { background: #FAFAFA; }
.expand-btn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.expand-icon { width: 16px; height: 16px; border: 1.5px solid #CCC; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #777; flex-shrink: 0; background: #fff; }
.pct { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 5px; min-width: 50px; text-align: center; }
.p-vg { background: #C8E6C9; color: #1B5E20; } .p-g { background: #DCEDC8; color: #33691E; }
.p-a  { background: #FFE082; color: #7B4800; } .p-r { background: #FFCDD2; color: #B71C1C; }

/* AI validation / processing */
.onb-btn:disabled { opacity: .5; cursor: not-allowed; }

.onb-proc-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
.onb-proc-stages { border: 1px solid #E7E9EE; border-radius: 14px; padding: 16px 18px; }

.onb-proc-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

// ── RAG helpers ──
function rag(v){ if(v===0)return'0'; if(v>=75)return'vg'; if(v>=60)return'g'; if(v>=40)return'a'; if(v>=20)return'r'; return'vr'; }
function valCell(v, isGrand){
  const r = rag(v);
  const cls = isGrand ? 'grand-cell' : '';
  return `<td class="${cls}">
    <div class="val rag-${r}">
      <span class="val-num num-${r}">${v}%</span>
      <span class="val-bar"><i class="bar-${r}" style="width:${v}%"></i></span>
    </div>
  </td>`;
}

// ── label cell ──
function labelCell(node, depth){
  const guides = Array.from({length: depth}, () => '<span class="indent-guide"></span>').join('');
  const hasKids = node.children && node.children.length;
  const chev = hasKids
    ? `<span class="chev ${node.open?'open':''}" onclick="togglePivot('${node.id}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 6 15 12 9 18"/></svg></span>`
    : `<span class="chev leaf"></span>`;
  let content;
  if (node.type === 'category') {
    content = `<span class="cat-badge ${node.cat==='avail'?'badge-avail':'badge-suff'}">${node.label}</span>`;
  } else if (node.type === 'field') {
    content = `<span class="label-text field-text">${node.label}</span>`;
  } else {
    content = `<span class="label-text">${node.label}</span>`;
  }
  return `<td class="label-cell"><div class="label-inner">${guides}${chev}${content}</div></td>`;
}

// ── render pivot ──
function renderPivot(){

  function walk(nodes, depth){
    nodes.forEach(n=>{
      const lvlClass = depth===0?'lvl-1':depth===1?'lvl-2':'lvl-3';
      rows.push(`<tr class="${lvlClass}">${labelCell(n,depth)}${valCell(n.v[0],false)}${valCell(n.v[1],false)}${valCell(n.v[2],true)}</tr>`);
      if(n.open && n.children) walk(n.children, depth+1);
    });
  }
  walk(pivotTree, 0);
  rows.push(`<tr class="grand-total-row">
    <td class="label-cell"><div class="label-inner"><span class="chev leaf"></span><span class="label-text">Grand Total</span></div></td>
    ${valCell(pivotGrand[0],false)}${valCell(pivotGrand[1],false)}${valCell(pivotGrand[2],true)}
  </tr>`);
  document.getElementById('pivot-tbody').innerHTML = rows.join('');
  updatePivotToggle();
}
function pivotAllExpanded(){ let all=true; (function w(nodes){ nodes.forEach(n=>{ if(n.children&&n.children.length){ if(!n.open) all=false; w(n.children);} }); })(pivotTree); return all; }
function updatePivotToggle(){ const b=document.getElementById('pivot-toggle'); if(!b) return; b.textContent = pivotAllExpanded() ? '⊖ Collapse all' : '⊕ Expand all'; }
function togglePivotAll(){ setAllSummary(!pivotAllExpanded()); }
function findPivot(nodes,id){ for(const n of nodes){ if(n.id===id)return n; if(n.children){const f=findPivot(n.children,id); if(f)return f;} } return null; }
function togglePivot(id){ const n=findPivot(pivotTree,id); if(n){ n.open=!n.open; renderPivot(); } }

const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : 0;
const ctsOf = s => Math.max(0, Math.round(s*0.82));          // 2nd heat column derived from base sufficiency
const allCols = () => DH.flatMap(d=>d.subs.flatMap(s=>s.products.flatMap(p=>p.cols)));
function tS(cols){ const o=avg(cols.map(c=>c.s)), ct=avg(cols.map(c=>ctsOf(c.s))); return [o,ct,Math.round((o+ct)/2)]; }
function tA(cols){ const a=avg(cols.map(c=>c.a)); return [a,a,a]; }
let HUID=0;
function hnode(label,lvl,extra,children,v){ return Object.assign({id:'H'+(HUID++),label,lvl,v,expanded:lvl<=3,children:children}, extra||{}); }
function buildHeatTree(){
  return DH.map(d=>{
    const dCols=d.subs.flatMap(s=>s.products.flatMap(p=>p.cols));
    return hnode(d.domain,1,{type:'domain'}, d.subs.map(s=>{
      const sCols=s.products.flatMap(p=>p.cols);
      return hnode(s.sub,2,{type:'sub'}, s.products.map(p=>
        hnode(p.product,3,{type:'product'}, [
          hnode(p.table,4,{type:'table'}, [
            hnode('Data Available',5,{cat:'avail'}, p.cols.map(c=>hnode(c.c,6,{type:'col'},null,[c.a,c.a,c.a])), tA(p.cols)),
            hnode('Data Sufficient',5,{cat:'suff'}, p.cols.map(c=>hnode(c.c,6,{type:'col'},null,[c.s,ctsOf(c.s),Math.round((c.s+ctsOf(c.s))/2)])), tS(p.cols)),
          ], tS(p.cols))
        ], tS(p.cols))
      ), tS(sCols));
    }), tS(dCols));
  });
}
const heatTree = buildHeatTree();
const heatGrand = tS(allCols());
function flattenHeat(nodes,out=[]){ nodes.forEach(n=>{ out.push(n); if(n.expanded&&n.children)flattenHeat(n.children,out); }); return out; }
function findHeat(nodes,id){ for(const n of nodes){ if(n.id===id)return n; if(n.children){const f=findHeat(n.children,id); if(f)return f;} } return null; }
function reToggleHeat(id){ const n=findHeat(heatTree,id); if(n){ n.expanded=!n.expanded; renderReHeat(); } }
function reSetAllHeat(open){ (function w(nodes){ nodes.forEach(n=>{ if(n.children){n.expanded=open; w(n.children);} }); })(heatTree); renderReHeat(); }
function heatLabel(r){
  if(r.cat) return `<span class="cat-badge ${r.cat==='avail'?'badge-avail':'badge-suff'}">${r.label}</span>`;
  if(r.type==='table') return `<span class="hier-table">${r.label}</span>`;
  if(r.type==='col') return `<span class="measure-name">${r.label}</span>`;
  return `<span class="heat-lbl-text lvl${r.lvl}">${r.label}</span>`;
}
function renderReHeat(){

}

function scoreColor(v){ if(v===0)return'#E53935'; if(v>=75)return'#34A853'; if(v>=60)return'#8BC34A'; if(v>=40)return'#F5A623'; if(v>=20)return'#EF6C42'; return'#C62828'; }
function ring(v, sizeClass='', onFa=false){ return `<div class="ring ${sizeClass} ${onFa?'on-fa':''}" style="--v:${v};--c:${scoreColor(v)}"><span class="ring-val">${v}%</span></div>`; }
function gateStatus(v){ if(v>=75)return['gs-pass','Pass']; if(v>=40)return['gs-warn','At risk']; return['gs-fail','Blocked']; }

let reCurrentUC = null;
let reProdTree = [];
let ucSort = 'low';
function reShowOverview(){
  document.getElementById('re-overview').classList.remove('hidden');
  document.getElementById('re-detail').classList.add('hidden');
}
function openReDetail(id){
  const u = reUseCases.find(x=>x.id===id); if(!u) return;
  reCurrentUC = id;
  reProdTree = prodTreeFor(u);
  renderReDetail(id);

  document.getElementById('re-detail').classList.remove('hidden');

// full-hierarchy contributing-products tree, scaled to the use case's sufficiency
function prodTreeFor(u){
  let pid=0; const f=u.factor;
  const sU = s=>Math.max(0,Math.min(100,Math.round(s*f)));
  const mk=(label,lvl,type,a,s,children)=>({id:'P'+(pid++),label,lvl,type,a,s,expanded:lvl<=3,children});
  return DH.map(d=>{
    const dc=d.subs.flatMap(s=>s.products.flatMap(p=>p.cols));
    return mk(d.domain,1,'domain',avg(dc.map(c=>c.a)),sU(avg(dc.map(c=>c.s))), d.subs.map(s=>{
      const sc=s.products.flatMap(p=>p.cols);
      return mk(s.sub,2,'sub',avg(sc.map(c=>c.a)),sU(avg(sc.map(c=>c.s))), s.products.map(p=>
        mk(p.product,3,'product',avg(p.cols.map(c=>c.a)),sU(avg(p.cols.map(c=>c.s))), [
          mk(p.table,4,'table',avg(p.cols.map(c=>c.a)),sU(avg(p.cols.map(c=>c.s))),
            p.cols.map(c=>mk(c.c,5,'col',c.a,sU(c.s),null)))
        ])
      ));
    }));
  });
}
function flattenP(nodes,out=[]){ nodes.forEach(n=>{ out.push(n); if(n.expanded&&n.children)flattenP(n.children,out); }); return out; }
function findP(nodes,id){ for(const n of nodes){ if(n.id===id)return n; if(n.children){const f=findP(n.children,id); if(f)return f;} } return null; }
function reToggleProd(id){ const n=findP(reProdTree,id); if(n&&n.children){ n.expanded=!n.expanded; renderReDetail(reCurrentUC); } }
function reSetAllProd(open){ (function w(nodes){ nodes.forEach(n=>{ if(n.children){n.expanded=open; w(n.children);} }); })(reProdTree); renderReDetail(reCurrentUC); }

// segmented control + searchable / sortable use-case list (scales to 60–100+ use cases)
function reSegment(which){
  document.getElementById('re-panel-usecases').classList.toggle('hidden', which!=='uc');

  document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.seg===which));

}
function renderUCList(){
  const q=(document.getElementById('uc-search')?.value||'').toLowerCase();

  let list=reUseCases.filter(u=>u.name.toLowerCase().includes(q)||u.domain.toLowerCase().includes(q));
  if(ucSort==='low') list.sort((a,b)=>a.sufficiency-b.sufficiency);
  else if(ucSort==='high') list.sort((a,b)=>b.sufficiency-a.sufficiency);
  else list.sort((a,b)=>a.name.localeCompare(b.name));

  el.innerHTML = list.length ? list.map(ucRow).join('') : '<div class="uc-empty">No use cases match your search.</div>';
}
function ucRow(u){
  const worst=[...u.drivers].sort((a,b)=>a.s-b.s)[0];
  const st=prodStatusOf(u.sufficiency), stLbl=st.charAt(0).toUpperCase()+st.slice(1);
  const blocker = worst.s<75
    ? `<span class="ucr-dot" style="background:${scoreColor(worst.s)}"></span>${worst.k} · ${worst.s}%`
    : `<span class="ucr-dot" style="background:#34A853"></span>All drivers healthy`;
  return `<div class="uc-rowcard" style="--accent:${u.accent}" onclick="openReDetail('${u.id}')">
    <div class="ucr-main"><div class="ucr-name">${u.name}</div><div class="ucr-dom">${u.domain}</div></div>

    <span class="status-pill st-${st}">${stLbl}</span>
    <div class="ucr-blocker">${blocker}</div>
    <span class="ucr-go"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
  </div>`;

const EXP_DESC = {
  'Customer Granularity':'banner_name',
  'Data Freshness':'14 days',
  'History Required':'2 yrs',
  'Product Granularity':'sku_code',
  'Store / DC Granularity':'y/n',
  'Time Granularity':'weekly',
};
let f3Benchmark = 60;
const mean = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
const driverScore = (uc,k) => { const d=uc.drivers.find(x=>x.k===k); return d?d.s:0; };
const ucDriverAvg = uc => Math.round(mean(uc.drivers.map(d=>d.s)));
function f3MeetClass(s){ return s>=75?'meet':(s>=40?'partial':'below'); }
function f3MeetIcon(s){ return s>=75?'✓':(s>=40?'⚠':'✗'); }
function priorSuff(uc, idx){ const d=((idx*7)%11)-4; return Math.max(0,Math.min(100, ucDriverAvg(uc)-d)); }
function sparkSvg(pts){
  const w=150,h=34,max=Math.max(...pts,1),min=Math.min(...pts,0),rng=Math.max(max-min,1),step=w/(pts.length-1);
  const coords=pts.map((p,i)=>`${(i*step).toFixed(1)},${(h-((p-min)/rng)*(h-6)-3).toFixed(1)}`);
  const last=coords[coords.length-1].split(',');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#248169" stroke-width="2" points="${coords.join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#248169"/></svg>`;

const GRAN_SHORT = {'Customer Granularity':'Customer','Data Freshness':'Freshness','History Required':'History','Product Granularity':'Product','Store / DC Granularity':'Store / DC','Time Granularity':'Time'};
function f4Scope(uc){
  let ids;
  if(uc.id==='otif') ids=['ord_ful','ship','inv'];
  else if(uc.id==='cts') ids=['cost','freight','o2c'];
  else { const all=F4_CATALOG.map(p=>p.id); const i=Math.max(0,reUseCases.indexOf(uc)); ids=[...new Set([all[i%all.length], all[(i+3)%all.length], all[(i+5)%all.length]])]; }
  const drv={}; uc.drivers.forEach(d=>drv[d.k]=d.s);   // use-case granularity attainment per dimension
  return ids.map((id,pIdx)=>{
    const p=F4_CATALOG.find(x=>x.id===id);
    // per-table granularity & quality across the 6 dimensions (DE-calculated), derived from the use case + per-table offset
    const gran=DK.map((k,j)=>{ let v=(drv[k]??50)+(((pIdx*13+j*7)%21)-10); v=Math.max(0,Math.min(100,Math.round(v))); return {k, short:GRAN_SHORT[k], exp:EXP_DESC[k], s:v}; });
    const psu=Math.round(mean(gran.map(g=>g.s)));        // table sufficiency = how well granularity is met
    const fields=p.fields.map((fl,fi)=>{ let su=psu+(((fi*11)%15)-7); su=Math.max(0,Math.min(100,Math.round(su))); return {...fl, product:p.product, av:fl.a, su}; });
    return {...p, fields, gran, su:psu, av:Math.round(mean(fields.map(x=>x.av)))};

function f4Effort(gaps){
  if(!gaps.length) return {level:'None', weeks:'ready now', cls:'eff-ok'};
  const depth=mean(gaps.map(f=>Math.max(0,75-f.su)));
  if(gaps.length<=1 && depth<25) return {level:'Low effort', weeks:'~1–2 weeks', cls:'eff-low'};
  if(gaps.length>=3 || depth>=45) return {level:'High effort', weeks:'~6+ weeks', cls:'eff-high'};
  return {level:'Medium effort', weeks:'~3–5 weeks', cls:'eff-med'};
}
function f4Process(p,gaps,g){
  const steps=[];
  steps.push(`Source <b>${g.short}</b> granularity in <code>${p.table}</code> — needs <b>${g.exp}</b>.`);
  if(gaps.length) steps.push(`Backfill &amp; validate ${gaps.length} column${gaps.length>1?'s':''}: ${gaps.slice(0,3).map(f=>f.label).join(', ')}${gaps.length>3?` +${gaps.length-3} more`:''}.`);
  else steps.push(`Maintain current feeds — all columns already meet target.`);
  steps.push(`Re-measure sufficiency and certify <code>${p.table}</code> for this use case.`);
  return steps;
}

function renderF4Pane(){

  const scope=f4Scope(uc), areas=f4Areas(scope), fs=scope.flatMap(p=>p.fields);
  const overall=Math.round(mean(fs.map(x=>x.su))), avail=Math.round(mean(fs.map(x=>x.av)));
  const vcls = overall>=75?'ready':(overall>=40?'partial':'bad');

  else { verdict='Not ready'; sentence=`<b>${uc.name}</b> can't be reliably supported yet — <b>${worstArea.area}</b> is the main gap.`; }
  const nextStep = `Improve <b>${worstField.label}</b> in ${worstField.product} — only ${worstField.su}% data sufficiency today (needs <b>${worstField.exp}</b>).`;

      <div class="f4-sec">Data this use case needs — table by table <span style="font-weight:600;color:#999;font-size:11.5px">(ordered by what to fix first · tap a row to see how to close it)</span></div>
      <div class="f4-kpi-wrap"><table class="f4-kpi">
        <thead><tr>

        </tr></thead>

                </tr>`).join('')}</tbody>

                <div class="f4-gran-grid">${p.gran.map(g=>{ const ic=g.s>=75?'✓':(g.s>=40?'⚠':'✗'); return `<div class="f4-gchip">

              </div>
            </div>`).join('')}
        </div>`).join('')}`;
  }
  document.getElementById('f4-pane').innerHTML = head + body;

function buildHeat5(uc){

function avgVecs(vs){ const n=vs[0].length, o=[]; for(let i=0;i<n;i++) o.push(Math.round(vs.reduce((a,v)=>a+v[i],0)/vs.length)); return o; }
function buildF5Detail(uc){
  const drv={}; uc.drivers.forEach(d=>drv[d.k]=d.s);
  let id=0, tIdx=0;
  const nd=(label,lvl,type,children,v)=>({id:'F5D'+(id++),label,lvl,type,v,expanded:lvl<=3,children});
  return DH.map(d=>{
    const subs=d.subs.map(s=>{
      const prods=s.products.map(p=>{
        tIdx++;
        const gran=DK.map((k,j)=>f5Clamp(Math.round((drv[k]??50)+(((tIdx*13+j*7)%19)-9))));   // 6 granularity drivers (per table)
        const suffT=Math.round(avg(gran));
        const measures=p.cols.map(c=>{ const a=c.a, g=Math.round((a+suffT)/2); return nd(c.c,5,'col',null,[a,...gran,suffT,g]); });
        const tableV=avgVecs(measures.map(m=>m.v));
        const tNode=nd(p.table,4,'table',measures,tableV); tNode.exp=p.exp;
        return nd(p.product,3,'product',[ tNode ],tableV);
      });
      return nd(s.sub,2,'sub',prods,avgVecs(prods.map(p=>p.v)));
    });

function f6RcaDownload(nodeId,colIdx){

  rows.push(['Header','Data availability',m.availPct+'%','Recoverable lift','+'+m.recLo+' to +'+m.recHi+' pp']);

  m.seg.forEach(s=>rows.push(['Driver segment','#'+s.rank+' '+s.market,s.tier,s.suff+'% suff',s.share+'% of gap · '+s.driver]));
  m.ms.forEach(p=>rows.push(['Trend',p.label,p.val+'%','','']));

}
function f6RcaLineageGraph(m){
  const zones=['bronze','silver','gold','source'];
  const ndc={CRITICAL:'nd-crit',HIGH:'nd-hi',MEDIUM:'nd-md',LOW:'nd-lo'};
  const root={name:m.table, lvl:0, suff:m.v, contrib:null, signal:f6RcaSignal(m.v,100)};
  const byLvl={0:[root],1:[],2:[],3:[]};
  m.lineage.forEach(o=>{ const L=parseInt(String(o.lvl).replace('L',''))||1; (byLvl[L]=byLvl[L]||[]).push({name:o.obj,lvl:L,suff:o.suff,contrib:o.contrib,signal:o.signal}); });
  const NW=196, NH=62, GX=64, GY=16;
  const counts=[0,1,2,3].map(L=>(byLvl[L]||[]).length), maxN=Math.max.apply(null,counts);
  const colH=Math.max(1,maxN)*(NH+GY);
  const nodes=[];
  [0,1,2,3].forEach(L=>{ const arr=byLvl[L]||[], n=arr.length; if(!n) return; const gap=(colH-n*NH)/(n+1);
    arr.forEach((nd,i)=>{ nd.x=L*(NW+GX); nd.y=Math.round(gap*(i+1)+i*NH); nd.lvl=L; if(L>0){ const par=byLvl[L-1]; nd.parent=par[i%par.length]; } nodes.push(nd); }); });
  const totalW=4*NW+3*GX, totalH=colH;
  let svg='<svg width="'+totalW+'" height="'+totalH+'" style="position:absolute;left:0;top:0;pointer-events:none">';
  nodes.forEach(nd=>{ if(nd.parent){ const p=nd.parent, x1=p.x+NW, y1=p.y+NH/2, x2=nd.x, y2=nd.y+NH/2, mx=(x1+x2)/2; svg+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="#CAD1DC" stroke-width="1.6"/>'; } });
  svg+='</svg>';
  const nh=nodes.map(nd=>'<div class="rca-lg-node '+(nd.lvl===0?'root ':'')+(ndc[nd.signal]||'nd-lo')+'" style="left:'+nd.x+'px;top:'+nd.y+'px;width:'+NW+'px">'
    +'<div class="rca-lg-name" title="'+nd.name+'">'+nd.name+'</div>'
    +'<div class="rca-lg-sub">Level '+nd.lvl+' · smart_exec_us_'+zones[nd.lvl]+'</div>'
    +'<div class="rca-lg-foot"><span class="rca-cov-v f5-g-'+rag(nd.suff)+'">'+nd.suff+'%</span><span class="rca-lg-c">'+(nd.contrib!=null?nd.contrib+'% gap':'current KPI')+'</span>'+f6SigB(nd.signal)+'</div></div>').join('');
  return '<div class="rca-lg-scroll"><div class="rca-lg-canvas" style="width:'+totalW+'px;height:'+totalH+'px">'+svg+nh+'</div></div>';
}

function nucHmBuildTree(){
  let uid=0;
  const node=(label,lvl,type,children,base)=>({id:'nh'+(uid++),label,lvl,type,expanded:lvl<=4,children,base,availableBase:base});
  const domains=[];
  NUC_MATCHES.forEach(p=>{
    let domain=domains.find(n=>n.label===p.domain);
    if(!domain){ domain=node(p.domain,1,'domain',[],0); domains.push(domain); }
    let sub=domain.children.find(n=>n.label===p.sub);
    if(!sub){ sub=node(p.sub,2,'sub',[],0); domain.children.push(sub); }
    const availableMeasures=p.gives.map((g,gi)=>{
      const b=g[1] ? f5Clamp(p.match-((gi*3)%10)) : f5Clamp(p.match-35-((gi*3)%8));
      return node(g[0],6,'col',null,Math.round(b));
    });
    const sufficientMeasures=p.gives.map((g,gi)=>{
      const b=g[1] ? f5Clamp(p.match-((gi*6)%22)) : f5Clamp(p.match-42-((gi*5)%12));
      const measure=node(g[0],6,'col',null,Math.round(b));
      measure.availableBase=availableMeasures[gi].base;
      return measure;
    });
    const available=node('Data Available',5,'category',availableMeasures,Math.round(mean(availableMeasures.map(k=>k.base))));
    available.cat='avail';
    const sufficient=node('Data Sufficient',5,'category',sufficientMeasures,Math.round(mean(sufficientMeasures.map(k=>k.base))));
    sufficient.cat='suff';
    const table=node(p.table,4,'table',[available,sufficient],sufficient.base);
    table.availableBase=available.base;
    sub.children.push(node(p.name,3,'product',[table],table.base));
  });
  const rollup=n=>{
    if(n.children&&n.children.length){
      n.children.forEach(rollup);
      if(n.type==='table'){
        const avail=n.children.find(c=>c.cat==='avail'), suff=n.children.find(c=>c.cat==='suff');
        n.base=suff?suff.base:n.base; n.availableBase=avail?avail.base:n.availableBase;
      }else{
        n.base=Math.round(mean(n.children.map(c=>c.base)));
        n.availableBase=Math.round(mean(n.children.map(c=>c.availableBase??c.base)));
      }
    }
    return n.base;
  };
  domains.forEach(rollup);
  return domains;
}

/* ═══════════ Add hierarchy / dimension — guided definition form ═══════════
   Captures the 5 questions the AI uses per hierarchy (identity, ordered levels + columns,
   level definitions/examples/format, lowest usable grain + lookalikes, summary) for one or
   more types, then registers the result in ONB_HIERS so the rest of the flow can use it. */
const ONB_HF_VERTICALS=['Customer','Product','Geography','Time','Other'];
const ONB_HF_Q=[
  {t:'Identity', f:'Identity + disambiguation'},
  {t:'Levels & columns', f:'Ordering (grain scale) + column identification'},
  {t:'Level details', f:'Reasoning + grain detection'},
  {t:'Lowest grain & lookalikes', f:'Heatmap flag + collision safety'},
  {t:'Summary', f:'Connective tissue'}
];
let onbHfSeq=0;
function onbHfLevel(){ return {id:++onbHfSeq, name:'', cols:[], def:'', examples:[], format:''}; }
function onbHfType(n){ return {name:`Type ${n}`, levels:[onbHfLevel(),onbHfLevel(),onbHfLevel()], lowest:null, looks:[], summary:''}; }
function onbHfT(){ return onb.hf.types[onb.hf.ti]; }
function onbHfWords(s){ return String(s||'').trim().split(/\s+/).filter(Boolean).length; }
function onbHfOpen(i){ const h=(typeof i==='number')?ONB_HIERS[i]:null;
  onb.hf=(h&&h.spec)?Object.assign(JSON.parse(JSON.stringify(h.spec)),{edit:i, ti:0}):{name:'', vertical:'', vOther:'', diff:'', types:[onbHfType(1)], ti:0, edit:null};
  onb.phase='hierform'; renderONB(); window.scrollTo(0,0); }
function onbHfClose(){ onb.hf=null; onb.phase='form'; renderONB(); window.scrollTo(0,0); }
function onbHfSet(f,v,re){ onb.hf[f]=v; if(re) renderONB(); else onbHfRailPaint(); }
function onbHfTab(ti){ onb.hf.ti=ti; renderONB(); }
function onbHfAddType(){ const T=onb.hf.types; T.push(onbHfType(T.length+1)); onb.hf.ti=T.length-1; renderONB(); }
function onbHfDelType(){ const hf=onb.hf; if(hf.types.length<=1){ f6Toast('A hierarchy needs at least one type.'); return; } hf.types.splice(hf.ti,1); hf.ti=Math.max(0,hf.ti-1); renderONB(); }
function onbHfTypeSet(f,v){ onbHfT()[f]=v; if(f==='name'){ const el=document.querySelector('.onb-hf-tab.on'); if(el) el.textContent=v||'Untitled type'; } onbHfRailPaint(); }
/* levels */
function onbHfLvAdd(){ onbHfT().levels.push(onbHfLevel()); renderONB(); }
function onbHfLvDel(li){ const t=onbHfT(), L=t.levels; if(L.length<=2){ f6Toast('A hierarchy needs at least 2 levels.'); return; } const id=L[li].id; L.splice(li,1); if(t.lowest===id) t.lowest=null; t.looks=t.looks.filter(x=>x.a!==id&&x.b!==id); renderONB(); }
function onbHfLvMove(li,d){ const L=onbHfT().levels, j=li+d; if(j<0||j>=L.length) return; [L[li],L[j]]=[L[j],L[li]]; renderONB(); }
function onbHfLvSet(li,f,v){ onbHfT().levels[li][f]=v; onbHfRailPaint(); }
function onbHfLvName(li,v){ onbHfT().levels[li].name=v; onbHfQ4Paint(); onbHfRailPaint(); }
function onbHfDef(li,el){ const L=onbHfT().levels[li]; L.def=el.value; const m=document.getElementById('hfwc-'+li); if(m){ const w=onbHfWords(L.def); m.textContent=`${w} word${w===1?'':'s'} · aim for 30–40`; m.className='onb-hf-meta'+(w>=30&&w<=40?' ok':w?'':' muted'); } onbHfRailPaint(); }
/* chip inputs (column names/codes · example values) */
function onbHfChipBox(li,kind){ const L=onbHfT().levels[li], arr=L[kind], cols=kind==='cols';
  const meta=cols?`<div class="onb-hf-meta ${arr.length?'ok':'muted'}">${arr.length?`${arr.length} column${arr.length>1?'s':''} / code${arr.length>1?'s':''}`:'Press Enter or comma to add — add every name this level appears as'}</div>`
    :`<div class="onb-hf-meta ${arr.length>=10?'ok':arr.length?'':'muted'}">${arr.length}/10 example values${arr.length?'':' — paste a comma-separated list or add one at a time'}</div>`;
  return `<div id="hfchip-${li}-${kind}"><div class="onb-hf-chipin" onclick="if(event.target===this)this.querySelector('input').focus()">${arr.map((v,k)=>`<span class="onb-hf-chip ${cols?'mono':''}">${onbEsc(v)}<button type="button" aria-label="Remove ${onbEsc(v)}" onclick="onbHfChipDel(${li},'${kind}',${k})">✕</button></span>`).join('')}<input ${cols?'list="onbHfCols"':''} placeholder="${cols?(arr.length?'Add another':'e.g. SHIP_TO_CUST_NUM'):(arr.length?'Add value':'e.g. 0001234567')}" onkeydown="onbHfChipKey(event,${li},'${kind}',this)" onblur="onbHfChipCommit(${li},'${kind}',this)" onpaste="setTimeout(()=>onbHfChipCommit(${li},'${kind}',this,1),0)"></div>${meta}</div>`; }
function onbHfChipPaint(li,kind,focus){ const el=document.getElementById(`hfchip-${li}-${kind}`); if(!el) return; el.outerHTML=onbHfChipBox(li,kind); if(focus){ const i=document.querySelector(`#hfchip-${li}-${kind} input`); if(i) i.focus(); } onbHfRailPaint(); if(kind==='cols') onbHfQ4Paint(); }
function onbHfChipCommit(li,kind,el,focus){ const raw=el.value; if(!raw.trim()) return; const a=onbHfT().levels[li][kind]; raw.split(/[,\n\t]+/).map(x=>x.trim()).filter(Boolean).forEach(v=>{ if(!a.includes(v)) a.push(v); }); el.value=''; onbHfChipPaint(li,kind,focus); }
function onbHfChipKey(e,li,kind,el){ if(e.key==='Enter'||e.key===','){ e.preventDefault(); onbHfChipCommit(li,kind,el,1); } else if(e.key==='Backspace'&&!el.value){ const a=onbHfT().levels[li][kind]; if(a.length){ a.pop(); onbHfChipPaint(li,kind,1); } } }
function onbHfChipDel(li,kind,k){ onbHfT().levels[li][kind].splice(k,1); onbHfChipPaint(li,kind); }
/* Q4 — lowest usable grain + lookalikes */
function onbHfLowest(id){ onbHfT().lowest=id; onbHfQ4Paint(); onbHfRailPaint(); }
function onbHfLookAdd(){ onbHfT().looks.push({a:null,b:null,how:''}); onbHfQ4Paint(); onbHfRailPaint(); }
function onbHfLookDel(k){ onbHfT().looks.splice(k,1); onbHfQ4Paint(); onbHfRailPaint(); }
function onbHfLookSet(k,f,v){ onbHfT().looks[k][f]=(f==='how')?v:(v?+v:null); onbHfRailPaint(); }
function onbHfQ4(){ const t=onbHfT(), named=t.levels.filter(l=>l.name.trim());
  const opt=(sel)=>`<option value="">Select level</option>${named.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${onbEsc(l.name)}</option>`).join('')}`;
  return `<div id="hfq4" class="onb-sec">
    <div class="onb-sec-h"><span class="onb-hf-q">4</span>Lowest usable grain &amp; lookalikes<span class="onb-hf-feeds">${ONB_HF_Q[3].f}</span></div>
    <div class="onb-sec-note">Which single level is the lowest usable grain for the Data Sufficiency heat map? And which levels have lookalike values that could be confused — how do you tell them apart?</div>
    <label class="onb-flabel">Lowest usable grain</label>
    ${named.length?`<div class="onb-hf-low">${named.map(l=>`<div class="onb-htype ${t.lowest===l.id?'on':''}" role="radio" aria-checked="${t.lowest===l.id}" onclick="onbHfLowest(${l.id})"><span class="onb-radio" style="margin-top:2px"></span><div><div class="onb-hf-low-n">${onbEsc(l.name)}</div>${l.cols.length?`<div class="onb-hf-low-c mono">${l.cols.map(onbEsc).join(', ')}</div>`:''}</div></div>`).join('')}</div>`:'<div class="onb-hf-meta muted">Name the levels above first.</div>'}
    <label class="onb-flabel" style="margin-top:18px">Lookalike levels</label>
    ${t.looks.length?`<div class="onb-hf-look onb-hf-look-h"><span>Level</span><span>Can be confused with</span><span>How to tell them apart</span><span></span></div>`:''}
    ${t.looks.map((x,k)=>`<div class="onb-hf-look">
      <span class="onb-select-wrap"><select class="onb-select sm" onchange="onbHfLookSet(${k},'a',this.value)">${opt(x.a)}</select></span>
      <span class="onb-select-wrap"><select class="onb-select sm" onchange="onbHfLookSet(${k},'b',this.value)">${opt(x.b)}</select></span>
      <input class="onb-input sm" style="font-family:inherit" placeholder="e.g. Ship-to IDs are 10 digits; Sold-to IDs carry a region prefix" value="${onbEsc(x.how)}" oninput="onbHfLookSet(${k},'how',this.value)">
      <button class="onb-tsrow-del" title="Remove pair" onclick="onbHfLookDel(${k})">${ONB_TRASH}</button>
    </div>`).join('')}
    <button class="onb-btn onb-addrow" style="padding:8px 16px" onclick="onbHfLookAdd()">＋ Add lookalike pair</button>
  </div>`; }
function onbHfQ4Paint(){ const el=document.getElementById('hfq4'); if(el) el.outerHTML=onbHfQ4(); }
/* completeness */
function onbHfStatus(t){ const hf=onb.hf, named=t.levels.filter(l=>l.name.trim());
  const q1=!!(hf.name.trim()&&hf.vertical&&(hf.vertical!=='Other'||hf.vOther.trim())&&hf.diff.trim());
  const mapped=named.filter(l=>l.cols.length).length, q2=named.length>=2&&mapped===named.length;
  const q3n=named.filter(l=>{ const w=onbHfWords(l.def); return w>=30&&w<=40&&l.examples.length>=10&&l.format.trim(); }).length;
  const low=named.find(l=>l.id===t.lowest), looksOk=t.looks.every(x=>x.a&&x.b&&x.a!==x.b&&x.how.trim()), q4=!!low&&looksOk;
  const q5=onbHfWords(t.summary)>0;
  return [
    {ok:q1, s:q1?'Complete':'Add name, vertical and how it differs'},
    {ok:q2, s:`${named.length} level${named.length===1?'':'s'} · ${mapped} mapped to columns${named.length<2?' (need 2+)':''}`},
    {ok:named.length>0&&q3n===named.length, s:`${q3n}/${named.length} levels fully described`},
    {ok:q4, s:!low?'Pick the lowest usable grain':looksOk?`Lowest: ${low.name}`:'Finish the lookalike pairs'},
    {ok:q5, s:q5?'Complete':'Write the overall summary'}
  ]; }
function onbHfRail(){ const hf=onb.hf, t=onbHfT(), st=onbHfStatus(t);
  return `<aside class="onb-hf-rail" id="hfRail">
    <div class="onb-hf-rail-h">Completeness · ${onbEsc(t.name||'Untitled type')}</div>
    ${st.map((x,i)=>`<div class="onb-hf-rq ${x.ok?'ok':''}"><span class="onb-hf-rdot">${x.ok?'✓':i+1}</span><div><div class="onb-hf-rt">${ONB_HF_Q[i].t}</div><div class="onb-hf-rf">Feeds ${ONB_HF_Q[i].f}</div><div class="onb-hf-rs">${onbEsc(x.s)}</div></div></div>`).join('')}
    <div class="onb-hf-rtypes">${hf.types.map((ty,ti)=>{ const n=onbHfStatus(ty).filter(x=>x.ok).length; return `<div class="onb-hf-rtype ${ti===hf.ti?'on':''}" onclick="onbHfTab(${ti})"><span>${onbEsc(ty.name||'Untitled type')}</span><b>${n}/5</b></div>`; }).join('')}</div>
  </aside>`; }
function onbHfRailPaint(){ const el=document.getElementById('hfRail'); if(el) el.outerHTML=onbHfRail(); }
/* save → registers into ONB_HIERS (+ a new dimension for a custom vertical) */
function onbHfSave(){ const hf=onb.hf, name=hf.name.trim(), vert=hf.vertical==='Other'?hf.vOther.trim():hf.vertical;
  if(!name){ f6Toast('Q1 · Give the hierarchy a name.'); return; }
  if(!vert){ f6Toast('Q1 · Pick the vertical.'); return; }
  if(ONB_HIERS.some((h,i)=>i!==hf.edit && h.name.toLowerCase()===name.toLowerCase())){ f6Toast('A hierarchy with that name already exists.'); return; }
  const tn=hf.types.map(t=>t.name.trim().toLowerCase());
  for(let ti=0; ti<hf.types.length; ti++){ const t=hf.types[ti], named=t.levels.filter(l=>l.name.trim()), lbl=t.name.trim()||`Type ${ti+1}`;
    const fail=m=>{ hf.ti=ti; renderONB(); f6Toast(`${lbl} · ${m}`); };
    if(!t.name.trim()) return fail('Give this type a name.');
    if(tn.indexOf(tn[ti])!==ti) return fail('Type names must be unique.');
    if(named.length<2) return fail('Q2 · Add at least 2 named levels.');
    if(named.some(l=>!l.cols.length)) return fail('Q2 · Every level needs at least one column name or code.');
    if(!named.find(l=>l.id===t.lowest)) return fail('Q4 · Pick the lowest usable grain.'); }
  const spec=JSON.parse(JSON.stringify({name, vertical:hf.vertical, vOther:hf.vOther, diff:hf.diff, types:hf.types}));
  const entry={name, dim:vert, custom:true, spec, types:hf.types.map(t=>{ const L=t.levels.filter(l=>l.name.trim()); return {name:t.name.trim(), levels:L.map(l=>l.name.trim()), cols:L.map(l=>l.cols.join(', ')), lowest:(L.find(l=>l.id===t.lowest)||{}).name}; })};
  if(hf.edit!==null){ const old=ONB_HIERS[hf.edit].name; ONB_HIERS[hf.edit]=entry;
    if(old!==name){ const k=onb.hiers.indexOf(old); if(k>=0) onb.hiers[k]=name; if(old in onb.hierType){ onb.hierType[name]=onb.hierType[old]; delete onb.hierType[old]; } } }
  else ONB_HIERS.push(entry);
  if(!onb.hiers.includes(name)) onb.hiers.push(name);
  if(!entry.types.some(t=>t.name===onb.hierType[name])){ if(entry.types.length===1) onb.hierType[name]=entry.types[0].name; else delete onb.hierType[name]; }
  if(hf.vertical==='Other' && !onbDimOpts().some(d=>d.toLowerCase()===vert.toLowerCase())){ onb.dimCustom.push(vert); onb.dims.push(vert); }
  const gaps=hf.types.reduce((n,t)=>n+onbHfStatus(t).filter(x=>!x.ok).length,0);
  onbHfClose(); f6Toast(`${name} saved with ${entry.types.length} type${entry.types.length>1?'s':''}${gaps?` · ${gaps} optional item${gaps>1?'s':''} still incomplete`:''}.`); }
/* page */
function onbHfLevelCard(l,li,n){ return `<div class="onb-hf-lv">
    <div class="onb-hf-lv-h">
      <span class="onb-hlv-n">${li+1}</span>
      <input class="onb-input sm" style="font-family:inherit" placeholder="${li===0?'Coarsest level, e.g. Channel':li===n-1?'Finest level, e.g. Ship-to':'Level name'}" value="${onbEsc(l.name)}" oninput="onbHfLvSet(${li},'name',this.value)" onchange="onbHfLvName(${li},this.value)">
      <span class="onb-hlv-acts"><button class="onb-hlv-btn" title="Move up (coarser)" onclick="onbHfLvMove(${li},-1)" ${li===0?'disabled':''}>↑</button><button class="onb-hlv-btn" title="Move down (finer)" onclick="onbHfLvMove(${li},1)" ${li===n-1?'disabled':''}>↓</button><button class="onb-tsrow-del" title="Remove level" onclick="onbHfLvDel(${li})">${ONB_TRASH}</button></span>
    </div>
    <div class="onb-hf-lv-grid">
      <div class="onb-jf onb-jf-wide"><label>Column name(s) / codes in source tables<span class="onb-hf-qs">Q2</span></label>${onbHfChipBox(li,'cols')}</div>
      <div class="onb-jf onb-jf-wide"><label>Definition<span class="onb-hf-qs">Q3</span></label><textarea class="nuc-textarea onb-hf-def" placeholder="30–40 words: what one value at this level represents, who owns it and how it's assigned…" oninput="onbHfDef(${li},this)">${onbEsc(l.def)}</textarea><div id="hfwc-${li}" class="onb-hf-meta ${onbHfWords(l.def)>=30&&onbHfWords(l.def)<=40?'ok':onbHfWords(l.def)?'':'muted'}">${onbHfWords(l.def)} word${onbHfWords(l.def)===1?'':'s'} · aim for 30–40</div></div>
      <div class="onb-jf"><label>10 example values<span class="onb-hf-qs">Q3</span></label>${onbHfChipBox(li,'examples')}</div>
      <div class="onb-jf"><label>Value format / pattern<span class="onb-hf-qs">Q3</span></label><input class="onb-input sm" placeholder="e.g. 10-digit numeric, zero-padded" value="${onbEsc(l.format)}" oninput="onbHfLvSet(${li},'format',this.value)"></div>
    </div>
  </div>`; }
function onbHfPage(){ const hf=onb.hf, t=onbHfT(), vert=hf.vertical==='Other'?hf.vOther.trim():hf.vertical;
  const sibs=vert?ONB_HIERS.filter((h,i)=>i!==hf.edit && h.dim.toLowerCase()===vert.toLowerCase()):[];
  const lib=ONB_HIERS.map((h,i)=>({h,i})).filter(x=>x.h.spec);
  return `<div class="onb-prereq-back" onclick="onbHfClose()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg> Back to onboarding</div>
  <div class="onb-dshead"><h2 class="onb-h" style="margin:0">${hf.edit!==null?`Edit ${onbEsc(onb.hf.name||'hierarchy')}`:'Add hierarchy / dimension'}</h2><div class="onb-dssub">Answer five questions so AI can identify this hierarchy, order its grain, detect it in source columns and avoid lookalike collisions. Add one or more types if the hierarchy has variants.</div></div>
  ${lib.length?`<div class="onb-hf-lib"><span class="onb-flabel" style="margin:0">Defined here</span>${lib.map(({h,i})=>`<span class="nuc-chip ${hf.edit===i?'on':''}" onclick="onbHfOpen(${i})" title="Edit">${onbEsc(h.name)} · ${h.types.length} type${h.types.length>1?'s':''}</span>`).join('')}${hf.edit!==null?`<span class="nuc-chip onb-chip-add" onclick="onbHfOpen()">＋ New</span>`:''}</div>`:''}
  <datalist id="onbHfCols">${onbHierColOpts().map(c=>`<option value="${c}">`).join('')}</datalist>
  <div class="onb-hf-grid"><div>
    <div class="onb-sec">
      <div class="onb-sec-h"><span class="onb-hf-q">1</span>Identity<span class="onb-hf-feeds">${ONB_HF_Q[0].f}</span></div>
      <div class="onb-sec-note">Name this hierarchy, pick its vertical, and in one line say how it differs from the other hierarchies in that vertical.</div>
      <label class="onb-flabel">Hierarchy name</label>
      <input class="onb-input" placeholder="e.g. Customer Hierarchy — Retail banner view" value="${onbEsc(hf.name)}" oninput="onbHfSet('name',this.value)">
      <label class="onb-flabel" style="margin-top:16px">Vertical</label>
      <div class="nuc-chips">${ONB_HF_VERTICALS.map(v=>`<span class="nuc-chip ${hf.vertical===v?'on':''}" onclick="onbHfSet('vertical','${v}',1)">${hf.vertical===v?'✓ ':''}${v}</span>`).join('')}</div>
      ${hf.vertical==='Other'?`<input class="onb-input" style="margin-top:10px" placeholder="Name the vertical / dimension, e.g. Channel" value="${onbEsc(hf.vOther)}" oninput="onbHfSet('vOther',this.value)" onchange="renderONB()">`:''}
      ${vert?`<div class="onb-hf-hint">${sibs.length?`Other hierarchies in <b>${onbEsc(vert)}</b>: ${sibs.map(h=>`<b>${onbEsc(h.name)}</b> (${h.types.map(x=>onbEsc(x.name)).join(', ')})`).join('; ')}. Say how this one differs.`:`No other hierarchies in <b>${onbEsc(vert)}</b> yet${hf.vertical==='Other'?' — it will also be added as a new dimension':''}.`}</div>`:''}
      <label class="onb-flabel" style="margin-top:16px">How it differs (one line)</label>
      <input class="onb-input" placeholder="e.g. Rolls stores up by retail banner rather than by legal customer entity" value="${onbEsc(hf.diff)}" oninput="onbHfSet('diff',this.value)">
    </div>
    <div class="onb-hf-tabs" role="tablist">${hf.types.map((ty,ti)=>`<button class="onb-hf-tab ${ti===hf.ti?'on':''}" role="tab" aria-selected="${ti===hf.ti}" onclick="onbHfTab(${ti})">${onbEsc(ty.name||'Untitled type')}</button>`).join('')}<button class="onb-hf-tab onb-hf-tab-add" onclick="onbHfAddType()">＋ Add type</button></div>
    <div class="onb-hf-typebar">
      <div><label class="onb-flabel">Type name</label><input class="onb-input sm" style="font-family:inherit" value="${onbEsc(t.name)}" oninput="onbHfTypeSet('name',this.value)"></div>
      ${hf.types.length>1?`<button class="onb-editbtn" onclick="onbHfDelType()">${ONB_TRASH} Remove this type</button>`:''}
    </div>
    <div class="onb-sec">
      <div class="onb-sec-h"><span class="onb-hf-q">2</span>Levels · coarsest → finest<span class="onb-hf-feeds">${ONB_HF_Q[1].f}</span></div>
      <div class="onb-sec-note">List every level from coarsest to finest with the exact column name(s)/codes it appears as. For each level, add a 30–40 word definition, 10 example values and the value format <span class="onb-hf-qs" style="margin:0">Q3 · ${ONB_HF_Q[2].f}</span></div>
      ${t.levels.map((l,li)=>onbHfLevelCard(l,li,t.levels.length)).join('')}
      <button class="onb-btn onb-addrow" style="padding:8px 16px" onclick="onbHfLvAdd()">＋ Add level</button>
    </div>
    ${onbHfQ4()}
    <div class="onb-sec">
      <div class="onb-sec-h"><span class="onb-hf-q">5</span>Overall summary<span class="onb-hf-feeds">${ONB_HF_Q[4].f}</span></div>
      <div class="onb-sec-note">What this hierarchy represents and how the levels roll up into each other.</div>
      <textarea class="nuc-textarea" placeholder="e.g. Stores roll up to customers, customers to banners, banners to the parent company and then to channel…" oninput="onbHfTypeSet('summary',this.value)">${onbEsc(t.summary)}</textarea>
    </div>
    <div class="onb-hf-foot"><button class="onb-btn" onclick="onbHfClose()">Cancel</button><button class="onb-btn primary" onclick="onbHfSave()">${hf.edit!==null?'Save changes':'Save hierarchy'}</button></div>
  </div>${onbHfRail()}</div>`; }
function onbTopBar(){ return `<div class="onb-topbar"><button class="onb-btn onb-topbtn" onclick="onbHfOpen()"><span class="onb-topbtn-plus">＋</span> Add hierarchy / dimension</button></div>`; }
function renderONB(){
  const inner = onb.phase==='prereq'
    ? `<div class="onb-prereq-back" onclick="onbClosePrereq()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg> Back to onboarding</div>` + onbStepper() + (onbStep===1?onbStepAdGroup():onbStepServiceNow())
    : onb.phase==='hierform' ? onbHfPage()
    : onbTopBar() + onbFormStepper() + onbFormBody();
  document.getElementById('tab-onb').innerHTML = `<div class="onb-shell">${inner}</div>${onbGrainPopupHtml()}${onbHierModalHtml()}`;
}

// init
document.addEventListener('click',function(e){ if(nucKpiOpen && !(e.target.closest && e.target.closest('.nuc-kpi-select'))){ nucKpiOpen=false; renderNUC(); } });
renderFlow6();
</script>
